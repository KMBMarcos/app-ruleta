<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruleta AHG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="grid">
    <div class="brand" style="grid-column: 1 / span 4"><img src="logo.png" alt="Arroyo Hondo Gardens"></div>
    <div class="where" style="grid-column: 5 / span 4">Sorteo</div>
  </header>

  <main class="grid stage">
    <div class="info">
      <h1><span class="line"><span>Gira la</span></span><span class="line"><span>ruleta<span class="dot">.</span></span></span></h1>
      <h2 class="label">Sorteo</h2>
      <p class="intro">Un giro. Diez casillas. Suerte.</p>
      <button id="spin" class="link" type="button">Girar →</button>
    </div>
    <div class="wheel">
      <svg id="svg" viewBox="-108 -108 216 216" role="img" aria-label="Ruleta de premios">
        <g id="spinner"><circle r="92" fill="none"/></g>
        <circle r="92" fill="none" stroke="#111110" stroke-width="1.5"/>
        <circle r="9" fill="#F2F0EB" stroke="#111110" stroke-width="1.5"/>
        <polygon points="-7,-108 7,-108 0,-93" fill="#111110"/>
      </svg>
    </div>
  </main>

  <footer>
    <p class="copy">© 2026 Arroyo Hondo Gardens</p>
  </footer>
</div>
<dialog id="modal" aria-labelledby="m-prize">
  <h2 class="label">Resultado</h2>
  <p id="m-prize"></p>
  <p id="m-note"></p>
  <p class="label">Escanea el QR y síguenos en Instagram</p>
  <img src="qr.png" alt="Código QR: síguenos en Instagram">
  <button id="m-close" class="link" type="button">Cerrar →</button>
</dialog>
<script src="app.js"></script>
</body>
</html>
